services:
  - type: web
    name: reachinbox-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npx tsc
    startCommand: cd backend && npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /auth/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-backend.onrender.com/auth/google/callback
      - key: FRONTEND_URL
        value: https://frontend-brown-nine-81.vercel.app
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: DEFAULT_DELAY_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "100"

databases:
  - name: reachinbox-db
    plan: free
    databaseName: reachinbox
    ipAllowList: []
